<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ededed">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="to-do">
<title>to-do</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
  // Apply the saved theme before first paint (no flash).
  try {
    var t = JSON.parse(localStorage.getItem('tempo.theme'));
    var r = document.documentElement;
    r.dataset.theme = t.theme;
    r.style.setProperty('--accent', t.accent);
    r.style.setProperty('--accent-ink', t.ink);
    if (t.text) r.style.setProperty('--accent-text', t.text);
  } catch (e) {
    document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  var m = document.querySelector('meta[name=theme-color]');
  if (m) m.setAttribute('content', document.documentElement.dataset.theme === 'dark' ? '#111111' : '#ededed');
</script>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/notes.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/ink.css">
</head>
<body>
<div id="app">
  <main id="screen"><noscript><p>to-do needs JavaScript to run. please enable it and reload.</p></noscript></main>
  <nav id="nav" aria-label="Main"></nav>
</div>
<div id="layers"></div>
<div id="toasts"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
